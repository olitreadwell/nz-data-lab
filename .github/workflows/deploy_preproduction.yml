name: Pre-Production Deploy

on:
  push:
    branches:
      - deploy/pre-production
  workflow_dispatch:

concurrency:
  group: deploy-preproduction
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  validate:
    name: Validate branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch
        run: |
          if [[ "${{ github.ref_name }}" != "deploy/pre-production" ]]; then
            echo "Error: Pre-production deployments must come from 'deploy/pre-production'"
            exit 1
          fi

  deploy:
    name: Deploy pre-production
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: Pre-Production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview
      - name: Build
        run: vercel build
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Optional: alias the pre-production deploy to a stable URL.
      # Requires VERCEL_SLUG_TEAM secret and a chosen preview domain.
      # - name: Set domain alias
      #   run: |
      #     vercel alias set ${{ steps.deploy.outputs.url }} <project>-preview.vercel.app \
      #       --scope ${{ secrets.VERCEL_SLUG_TEAM }}
