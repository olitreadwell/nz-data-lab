name: Pre-Production Deploy

on:
  push:
    branches:
      - deploy/pre-production
  workflow_dispatch:

concurrency:
  group: deploy-preproduction
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  validate:
    name: Validate branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch
        run: |
          if [[ "${{ github.ref_name }}" != "deploy/pre-production" ]]; then
            echo "Error: Pre-production deployments must come from 'deploy/pre-production'"
            exit 1
          fi

  deploy:
    name: Deploy pre-production
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: Pre-Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Pull Vercel environment
        run: npx vercel@59.1.4 pull --yes --environment=preview
      - name: Build
        run: npx vercel@59.1.4 build
      - name: Deploy
        id: deploy
        run: |
          url=$(npx vercel@59.1.4 deploy --prebuilt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify security headers on deployed site
        run: node apps/web/scripts/check-deployed-security-headers.mjs "${{ steps.deploy.outputs.url }}"
      # Optional: alias the pre-production deploy to a stable URL.
      # Requires VERCEL_SLUG_TEAM secret and a chosen preview domain.
      # - name: Set domain alias
      #   run: |
      #     npx vercel@59.1.4 alias set ${{ steps.deploy.outputs.url }} <project>-preview.vercel.app \
      #       --scope ${{ secrets.VERCEL_SLUG_TEAM }}
