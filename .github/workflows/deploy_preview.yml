name: Preview Deploy

on:
  pull_request:
    branches:
      - main
      - deploy/pre-production
      - deploy/production

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Preview
    # Only deploy previews for PRs from the same repository. Fork PRs are
    # untrusted: they can run attacker-controlled code, so they must never
    # receive the Vercel secrets or run vercel build/deploy with them.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Pull Vercel environment
        run: npx vercel@59.1.4 pull --yes --environment=preview
      - name: Build
        run: npx vercel@59.1.4 build
      - name: Deploy
        id: deploy
        run: |
          url=$(npx vercel@59.1.4 deploy --prebuilt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment PR with preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed to: ${{ steps.deploy.outputs.url }}`
            })
