name: Preview Deploy

on:
  pull_request:
    branches:
      - main
      - deploy/pre-production
      - deploy/production

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Preview
    # Only deploy previews for PRs from the same repository. Fork PRs are
    # untrusted: they can run attacker-controlled code, so they must never
    # receive the Vercel secrets or run vercel build/deploy with them.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview
      - name: Build
        run: vercel build
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed to: ${{ steps.deploy.outputs.url }}`
            })
