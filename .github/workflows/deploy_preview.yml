name: Preview Deploy

on:
  # Manual only: every PR was burning a Vercel preview deploy. Run this
  # workflow_dispatch when a preview is actually wanted.
  workflow_dispatch:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Preview
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Pull Vercel environment
        run: npx vercel@59.1.4 pull --yes --environment=preview
      - name: Build
        run: npx vercel@59.1.4 build
      - name: Deploy
        id: deploy
        run: |
          url=$(npx vercel@59.1.4 deploy --prebuilt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify security headers on deployed site
        run: node apps/web/scripts/check-deployed-security-headers.mjs "${{ steps.deploy.outputs.url }}"
