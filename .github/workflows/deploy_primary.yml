name: Deploy to Vercel (primary)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily refresh: the sheep-index experiment is a build-time snapshot, so a
  # scheduled redeploy keeps its Stats NZ numbers from going stale.
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: vercel-primary
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Pull Vercel environment
        run: npx vercel@59.1.4 pull --yes --environment=production
      - name: Build
        run: npx vercel@59.1.4 build --prod
        env:
          STATS_NZ_SUBSCRIPTION_KEY: ${{ secrets.STATS_NZ_SUBSCRIPTION_KEY }}
      - name: Deploy
        id: deploy
        run: |
          url=$(npx vercel@59.1.4 deploy --prebuilt --prod)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Vercel is a `_headers`-aware host, so the served response must carry
      # every required security header. A missing header fails the deploy
      # loudly instead of silently passing.
      - name: Verify security headers on deployed site
        run: node apps/web/scripts/check-deployed-security-headers.mjs "${{ steps.deploy.outputs.url }}"
